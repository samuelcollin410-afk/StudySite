<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudySpace</title>

  <!-- ✅ CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ✅ Your app HTML -->
  <div class="app">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand" id="homeBtn" title="Back to Home">
        <div class="logoDot"></div>
        <div>
          <div class="brandTitle">StudySpace</div>
          <div class="brandSub">Quizlet-style • yours</div>
        </div>
      </div>

      <div class="topActions">
        <button class="btn" id="exportAllBtn">Export All</button>
        <button class="btn" id="importBtn">Import</button>
        <button class="btn" id="openSettingsBtn">Settings</button>
        <button class="btn primary" id="createStudyBtn">Create</button>
      </div>
    </header>

    <!-- HOME VIEW -->
    <main id="viewHome" class="view">
      <section class="card">
        <div class="cardHead">
          <div>
            <h2>Studies</h2>
            <div class="muted">Pick one to study, or create a new one.</div>
          </div>
          <div class="row">
            <input id="studySearch" class="input" placeholder="Search studies..." />
            <button class="btn" id="clearSearchBtn">Clear</button>
          </div>
        </div>

        <div class="nowBar">
          <div>
            <div class="muted">Now</div>
            <div id="nowTime" class="nowTime">—</div>
          </div>
          <div class="todayBox">
            <div class="muted">Today</div>
            <div id="todayReminders" class="todayReminders">No reminders today.</div>
          </div>
        </div>

        <div id="studiesList" class="list"></div>
      </section>

      <div class="grid2">
        <section class="card">
          <div class="cardHead">
            <div>
              <h3>Calendar</h3>
              <div class="muted">Jan 2026 → Jan 2027. Click a date to view/add reminders.</div>
            </div>
          </div>
          <div id="calendarWrap"></div>
        </section>

        <section class="card">
          <div class="cardHead">
            <div>
              <h3>To-do</h3>
              <div class="muted">Check = auto delete in 12s. Delete button = 6s countdown.</div>
            </div>
          </div>

          <div class="row">
            <input id="todoInput" class="input" placeholder="New to-do..." />
            <button class="btn primary" id="addTodoBtn">Add</button>
          </div>

          <div id="todoList" class="list"></div>
        </section>
      </div>
    </main>

    <!-- STUDY VIEW -->
    <main id="viewStudy" class="view hidden">
      <!-- (keep the rest of your HTML EXACTLY as you have it) -->
      <!-- paste your remaining study view + modals here -->
    </main>

    <!-- (paste all the modals here too, same as your file) -->
  </div>

  <!-- ✅ JS (put this at the very bottom so elements exist first) -->
  <script src="app.js"></script>
</body>
</html>
